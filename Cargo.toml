[workspace]
resolver = "2"
members = ["software/breezer", "software/plugin-api"]
default-members = ["software/breezer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Stananas/Breezer"
authors = ["Breezer Contributors"]
homepage = "https://github.com/Stananas/Breezer"

[workspace.dependencies]
breezer-plugin-api = { path = "software/plugin-api" }

slint = { version = "1.18", default-features = false, features = [
  "backend-winit-x11", "renderer-software", "compat-1-2", "std",
  "accessibility", "image-default-formats",
] }
slint-build = "1.18"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls", "cookies", "gzip", "json", "query", "form", "stream", "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-decoder = "0.3"
log = "0.4"
env_logger = "0.11"
dirs = "6"
webbrowser = "1"

md-5 = "0.10"
aes = "0.8"
blowfish = "0.9"
cbc = { version = "0.1", features = ["alloc", "std"] }
hex = "0.4"

semver = "1"
url = "2"

symphonia = { version = "0.5", default-features = false, features = [
  "mp3", "aac", "isomp4", "flac", "pcm", "wav", "ogg", "vorbis",
] }
rodio = { version = "0.22", default-features = false, features = [
  "playback", "mp3", "mp4", "flac", "wav",
] }
