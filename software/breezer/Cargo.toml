[package]
name = "breezer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Ultra-lightweight native Deezer client (Rust + Slint)"
keywords = ["deezer", "music", "player", "streaming", "slint"]
categories = ["multimedia::audio", "gui"]
default-run = "breezer"

[dependencies]
breezer-plugin-api = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jpeg-decoder = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
dirs = { workspace = true }
webbrowser = { workspace = true }
md-5 = { workspace = true }
aes = { workspace = true }
blowfish = { workspace = true }
cbc = { workspace = true }
hex = { workspace = true }
semver = { workspace = true }
url = { workspace = true }
symphonia = { workspace = true }
rodio = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

# Slint backend: keep the exact current feature set on Linux (X11), and give
# other OS the generic winit backend so the releases can be compiled/packaged
# on Windows and macOS as well.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1.18", default-features = false, features = [
  "backend-winit-x11", "renderer-software", "compat-1-2", "std",
  "accessibility", "image-default-formats",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
slint = { version = "1.18", default-features = false, features = [
  "backend-winit", "renderer-software", "compat-1-2", "std",
  "accessibility", "image-default-formats",
] }

[lib]
name = "breezer"
path = "src/lib.rs"

[[bin]]
name = "breezer"
path = "src/main.rs"

# cargo-packager (release bundling: AppImage/deb on Linux, dmg on macOS, nsis on Windows)
[package.metadata.packager]
product-name = "Breezer"
identifier = "app.breezer.desktop"
publisher = "Breezer Contributors"
description = "Ultra-lightweight native Deezer client"
homepage = "https://github.com/Stananas/Breezer"
icons = ["icons/icon.png", "icons/icon.icns", "icons/icon.ico"]
# No `formats` list: cargo-packager 0.11 builds a GLOBAL list on every host
# (nsis on Linux would look for a .exe). Omitting it uses per-host defaults:
# AppImage + deb on Linux, dmg (macOS), nsis (Windows).