name: Versioning (release-plz)

# Semantic versioning & changelog from Conventional Commits.
# On every push to main (software changes) this workflow opens or updates a
# "release" PR that bumps the version + appends the changelog.
# Merging that PR then triggers release-pr.yml, which tags vX.Y.Z and creates
# the GitHub Release (building the installers happens in release.yml).

on:
  push:
    branches: [main]
    paths: ["software/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software
      - name: Run release-plz (open/update release PRs)
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
          manifest_path: software/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}