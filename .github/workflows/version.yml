name: Versioning (auto bump + tag)

# On every push to main (software changes): if there are feat/fix Conventional
# Commits since the last `breezer-v*` tag, auto-bump the workspace version in
# Cargo.toml, tag `breezer-vX.Y.Z` and push both. release.yml (triggered by the
# tag) then builds the installers — fully automatic, no manual PR to merge.

on:
  push:
    branches: [main]
    paths:
      - "software/**"
      - "Cargo.toml"
      - "scripts/**"
      - ".github/workflows/version.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Auto-bump + tag
        run: bash scripts/release-bump.sh
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}