name: Release

# Triggered on v* tags (created by release-plz). Builds signed-less artifacts
# for Linux / macOS / Windows via cargo-packager and attaches them to the Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: release (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-aarch64
          - os: macos-13
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (audio/windowing/build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev cmake clang libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software

      - name: Install cargo-packager
        run: cargo install cargo-packager

      - name: Package
        working-directory: software
        run: |
          cargo build --release
          cargo packager --release

      - name: Collect artifacts + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Installers can land in either target/ or packager/ depending on the
          # cargo-packager version — pick up every bundle we know how to build.
          find software -maxdepth 4 -type f \( \
            -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) \
            -exec cp -n {} dist/ \; 2>/dev/null || true
          # Plain executable fallback (Linux/macOS) + Windows .exe, named
          # per-platform so the built-in auto-update can pick the right one
          # (updater::platform_key matches these names exactly).
          cp -n software/target/release/breezer dist/breezer-${{ matrix.artifact }} 2>/dev/null || true
          cp -n software/target/release/breezer.exe dist/breezer-${{ matrix.artifact }}.exe 2>/dev/null || true
          find dist -type f -exec sha256sum {} + > dist/SHA256SUMS.txt
          echo "--- artifacts ---"
          ls -la dist/
          cat dist/SHA256SUMS.txt

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false