name: Release PR (release-plz)

# Whenever the "release" PR opened by version.yml is MERGED, tag the new
# version (vX.Y.Z, annotated) and publish the GitHub Release.
# The v* tag then triggers release.yml, which builds the installers.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software
      - name: Run release-plz (tag + release)
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
          manifest_path: software/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}